[package]
name = "blockhash"
version = "1.0.0"
edition = "2018"
resolver = "2"
rust-version = "1.70.0"

authors = ["James Mills <james@jaehl.net>"]
description = "A perceptual hashing algorithm for detecting similar images."
keywords = ["blockhash", "fingerprint", "hash", "perceptual"]
categories = ["multimedia::images", "no-std"]
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/blockhash"
homepage = "https://github.com/jaehl/blockhash"
repository = "https://github.com/jaehl/blockhash"

[dependencies]
image = { version = "0.25.10", optional = true, default-features = false, features = [
  "jpeg",
  "png",
] }
serde = { version = "1.0.229", optional = true, default-features = false, features = [
  "derive",
] }
serde_bytes = { version = "0.11.19", optional = true, default-features = false }

[features]
default = ["std", "image", "serde"]
serde = ["dep:serde", "dep:serde_bytes"]
std = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
